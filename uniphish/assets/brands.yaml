# cdn_hosts (official asset hosts that clone kits hot-link), user_content_domains
# (brand-owned but anyone can publish there: official status does NOT apply),
# keywords (lowercase ASCII tokens), native_names (non-ASCII names), ambiguous (common
# word / short name: needs context), aliases.
