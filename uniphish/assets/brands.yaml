#
# Loaded and validated by uniphish/url/brandkb.py.  Accuracy of `official_domains`
# directly controls the false-positive rate: a domain is listed ONLY when the brand
# is known to own it; when unsure it is omitted (a missing domain costs a little recall,
# a wrong one whitelists phishing).
