# Credential / urgency lure lexicon for matching against URL hosts, paths and short
# text (SMS-length) across languages. Phishing URLs reuse the vocabulary of the
# message they accompany ("login", "verifica", "安全", "доставка") in the victim's
# language, so an English-only list silently misses most non-English campaigns.
#
# Structure
#   category_weights   default log-odds contribution per category (weak evidence:
#                      lure words alone are common on legitimate sites)
#   languages.<tag>.<category>  list of terms; each term is a string or
#                      {t: term, w: weight} to override the category weight
#   Language tags are BCP-47-ish: "und" = language-neutral technical token (login,
#   2fa, kyc ...), "hi-Latn" = Hinglish (Hindi in Latin script), zh-Hans / zh-Hant.
#
# Matching semantics (see uniphish/assets/lists.py): terms are lower-cased; terms in
# space-delimited scripts (Latin, Cyrillic, Greek, Arabic, Hebrew, Devanagari, Bengali,
# Tamil ...) match on token boundaries (so "tax" does not match inside "syntax");
# terms in spaceless scripts (Han, Kana, Hangul, Thai) match as substrings. Latin terms
# with diacritics also match their accent-stripped form (URLs usually drop accents).
#
# Provenance: curated from phishing-kit and campaign vocabulary reported in public
# research (Cofense, Proofpoint, Kaspersky, Group-IB, APWG, Google Safe Browsing
# reports), then translated by hand into each language by the project maintainers.
# Native-speaker review of the lower-resource languages (bn, ta, sw, tl, fa) is
# welcome; see assets/README.md.
version: 1
# Suffixing / agglutinative languages whose inflected forms (tr 'hesabiniz', id 'akunnya')
# should also match by stem (term length >= 5, token must extend the term). Discounted.
stem_languages: [tr, id, ms]
category_weights:
  credential: 0.7
  account: 0.5
  urgency: 0.6
  financial: 0.5
  delivery: 0.5
  identity: 0.6
  security: 0.3
