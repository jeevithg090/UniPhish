# Free / consumer mailbox providers. Used for BEC and phishing-sender analysis: a
# "company" mail from a free provider, a reply-to that diverges to one, or credentials
# exfiltrated to one are all weak-to-moderate signals. These are legitimate
# providers, so presence is context, never proof.
# Groups: global (worldwide), regional (country/region-dominant providers).
# Sources: public provider lists, ISP/webmail market-share references and the
# widely used free-email-domain lists (e.g. the community "free-email-domains" lists).
