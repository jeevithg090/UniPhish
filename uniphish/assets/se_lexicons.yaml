# UniPhish multilingual social-engineering lexicons (lexical, deterministic).
#
# Consumed by uniphish/nlp/social_engineering.py. Every phrase below is SYNTHETIC,
# generic and inert: short manipulation cues of the kind phishing / BEC / smishing
# messages share. There are no brands, domains, numbers or payloads in this file.
#
# Layout
#   tactics.<tactic>.weight   default log-odds-style weight of one hit (0.1 .. 5)
#   tactics.<tactic>.terms    mapping  lang -> list of phrases
#
# Phrase syntax
#   "phrase"          matched after normalisation (case-fold, Latin accents stripped,
#                     Arabic diacritics stripped, NFKC, digits -> ASCII, whitespace
#                     collapsed). Latin / Cyrillic / Greek phrases are token-aware
#                     (matched on word boundaries); every other script is matched as
#                     a substring because those scripts do not separate words.
#   "phrase @0.6"     overrides the tactic's default weight for this phrase.
#   "stem*"           open right edge (matches inflected forms: "stem", "stems", ...).
#
# Each phrase becomes one lexicon entry {tactic, lang, weight, term}. Identical
# normalised phrases within a tactic are de-duplicated (first language wins).
# Language tags: BCP-47-ish; "hi-Latn" is romanised Hindi (Hinglish).

version: 1

scoring:
  # Hits inside one tactic: distinct phrases sorted by weight, each next one worth
  # `within_decay` times the previous; the tactic total is capped.
  within_decay: 0.65
  tactic_cap: 4.0
  # Tactics sorted by strength; the i-th strongest is scaled by cross_decay[i]
  # (different tactics add up, but with diminishing returns).
  cross_decay: [1.0, 0.8, 0.65, 0.5, 0.4, 0.3, 0.25, 0.2]
  combo_cap: 4.0
  logit_cap: 12.0
  # score = 1 - exp(-log_odds / score_scale)
  score_scale: 3.0
  # Long texts need proportionally more evidence: pressure language in a lure is dense.
  density_ref_chars: 2000
  density_slope: 0.5
  # A hit counts as an "ask" flag only at or above these weights.
  credential_ask_min_weight: 1.0
  payment_ask_min_weight: 0.8
  # Combinations that are more than the sum of their parts. `requires` entries are
  # tactic names (or "phone" = a phone number was extracted); a nested list means
  # "any of".
  combos:
    - {requires: [urgency, credential], bonus: 1.0}
    - {requires: [threat, urgency, [credential, cta, otp]], bonus: 0.6}
    - {requires: [authority, threat], bonus: 0.6}
    - {requires: [secrecy, payment], bonus: 1.5}
    - {requires: [authority, payment, urgency], bonus: 1.0}
    - {requires: [otp, [urgency, threat, authority]], bonus: 1.0}
    - {requires: [techsupport, phone], bonus: 1.5}
    - {requires: [[threat, payment, tax], phone], bonus: 0.8}
    - {requires: [delivery, [payment, cta]], bonus: 0.5}
    - {requires: [crypto, [credential, cta]], bonus: 1.0}
    - {requires: [reward, [credential, payment]], bonus: 0.8}

# Words just before / after an OTP phrase that turn an ask into a warning
# ("never share the code"). Latin / Cyrillic words are matched as whole tokens.
negators:
  window_before: 24
  window_after: 14
  before:
    - "do not"
    - "don't"
    - "dont"
    - "never"
    - "won't"
    - "no compartas"
    - "nunca"
    - "nao"
    - "jamais"
    - "ne pas"
    - "ne jamais"
    - "nicht"
    - "niemals"
    - "mai"
    - "non"
    - "не"
    - "никогда"
    - "ніколи"
    - "asla"
    - "hicbir zaman"
    - "nooit"
    - "nigdy"
    - "jangan"
    - "đừng"
    - "dung"
    - "请勿"
    - "不要"
    - "切勿"
    - "請勿"
    - "絕不"
    - "절대"
    - "لا "
    - "لن "
    - "هرگز"
    - "कभी"
    - "आप न"
    - "อย่า"
    - "mat "
  after:
    - "ないでください"
    - "しないで"
    - "はいけません"
    - "하지 마"
    - "하지마"
    - "하지 말"
    - "않도록"
    - "不要告诉"
    - "不要透露"
    - "不得"
    - "にしないで"

