# "Living off trusted sites" (LOTS): legitimate, reputable platforms whose free tiers,
# user-content or tunnelling features are routinely abused to host phishing pages,
# payloads and redirectors. Content on these hosts inherits the platform's reputation,
# so reputation / top-site legitimacy credit MUST NOT be granted to them, and a
# credential-harvesting page on one is far more suspicious than the host alone suggests.
#
# match: host suffix (label-boundary safe: "pages.dev" matches "x.pages.dev", never
#        "evilpages.dev"). path: optional path prefix that must also match (used where
#        only one path of a major domain is user content, e.g. dropbox.com/scl).
# kind:  hosting | serverless | forms | storage | docs | ipfs | tunnel | blog |
#        site_builder | file_share
# Sources: public vendor abuse reports, Cloudflare/Microsoft/Google threat write-ups,
# Proofpoint/Cofense/Netskope/Unit 42 research on abused hosting platforms.
