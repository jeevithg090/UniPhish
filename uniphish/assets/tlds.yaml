# Abused / high-abuse-rate TLDs with a calibrated risk weight (signed log-odds,
# 0.3 .. 1.5 on the UniPhish signal scale: weak-to-moderate contextual evidence).
#
# A TLD alone is never proof of phishing; the weight is a prior shift reflecting how
# over-represented the TLD is among phishing/malware registrations relative to its size
# in public abuse research (Spamhaus "most abused TLDs", Interisle Phishing Landscape
# reports, Netcraft/Cloudflare/SURBL abuse-rate summaries). Weights are deliberately
# conservative so legitimate sites on cheap TLDs are not flagged by this alone.
#
# tier: free   - freely/near-free registered, historically dominated by abuse (Freenom)
#       cheap  - sub-$2 promotional registrations at scale, high abuse share
#       gtld   - new gTLD with elevated phishing share
#       confusing - file-extension look-alike TLDs (.zip/.mov) that confuse URL parsing
version: 1
tlds:
