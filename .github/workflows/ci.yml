name: CI

# Offline, deterministic, no secrets: the suite never touches the network (tests/conftest.py
# blocks it) and never needs an API key. Safe to run on forks and pull requests.

on:
  push:
    branches: [main, uniphish-2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # Same lint scope as `make lint`: the v2 platform (the v1 research modules predate the
  # ruleset). Keep the two lists in sync.
  LINT_PATHS: >-
    uniphish/__init__.py uniphish/core uniphish/url uniphish/page uniphish/mail
    uniphish/files uniphish/nlp uniphish/intel uniphish/agent uniphish/hunt uniphish/export
    uniphish/ai uniphish/store uniphish/server uniphish/cli uniphish/integrations uniphish/eval
    uniphish/analyzers uniphish/assets bot
    tests/integration tests/test_smoke.py tests/agent tests/ai tests/analyzers tests/assets
    tests/bot tests/cli tests/core tests/eval tests/export tests/files tests/hunt
    tests/integrations tests/intel tests/mail tests/nlp tests/page tests/server tests/store
    tests/url

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install "ruff>=0.5"
      - run: ruff check $LINT_PATHS --output-format=github

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (all extras + dev tools)
        run: python -m pip install -e ".[dev]"
      # Chromium is only exercised by the optional sandbox-detonation path, and the suite
      # mocks it, so a failed download must never turn the build red.
      - name: Install Playwright Chromium (optional)
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: python -m playwright install --with-deps chromium
      - name: Pytest (offline; no network, no slow tests)
        # tests/test_baselines.py imports TensorFlow (the 'train' extra) at collection time.
        run: >-
          python -m pytest -m "not network and not slow"
          --ignore=tests/test_baselines.py -ra --durations=15

  package:
    name: Build sdist + wheel
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Wheel ships its data files (assets, model, templates, dashboard)
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          need = ["uniphish/py.typed", "uniphish/assets/brands.yaml", "uniphish/assets/unicode/",
                  "uniphish/assets/model/", "uniphish/server/templates/"]
          missing = [n for n in need if not any(x.startswith(n) for x in names)]
          print(wheel, len(names), "files")
          sys.exit("wheel is missing: " + ", ".join(missing) if missing else 0)
          PY
      - name: Install the wheel into a clean venv and scan (core dependencies only)
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/python - <<'PY'
          import uniphish
          v = uniphish.scan_url("https://pаypal.com/signin", timeout_s=120, analyzer_timeout_s=60)
          print(v.level.value, v.score, v.brand.name if v.brand else None)
          assert v.level.value == "malicious" and v.brand and v.brand.brand == "paypal"
          PY
          /tmp/clean/bin/uniphish version
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  web:
    name: Web console (node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Detect web/
        id: detect
        run: |
          if [ -f web/package-lock.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, type-check, build, test
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test
      - name: Upload the built dashboard
        if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: uniphish/server/static/
          if-no-files-found: error

  extension:
    name: Browser extension (node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --test (on-device engine, manifest, i18n, fusion)
        working-directory: extension
        run: node --test test/
