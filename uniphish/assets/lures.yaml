  und:
    credential: ["login", "logon", "signin", "sign-in", "log-in", "sso", "mfa", "2fa", "otp", "webmail", "auth", "authenticate", "authentication", "oauth", "passcode", "passkey", "credentials", "relogin"]
    identity: ["kyc", "kyb", "idverify"]
    account: ["webscr", {t: "cmd", w: 0.2}, "myaccount", "wallet", "reactivate", "reactivation"]
    security: ["secure", "security"]
  en:
    credential: ["log in", "sign in", "password", "passwd", "unlock", "recovery", {t: "recover", w: 0.25}, {t: "reset", w: 0.25}, "verification code", "security code", "single sign-on"]
