# Dynamic-DNS provider zones. Free subdomains here cost nothing, can be repointed in
# seconds and are heavily used for C2, phishing kits and fast-flux hosting, so a
# credential page or lure host under one of these zones is far less likely to be a
# legitimately branded property. Matching is by host suffix, label-boundary safe.
# Sources: public DDNS provider documentation and abuse research (e.g. Cisco Talos,
# Unit 42, Palo Alto "dynamic DNS" reports).
